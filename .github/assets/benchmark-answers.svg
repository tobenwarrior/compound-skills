<title id="title">Reviews and answers</title>
<desc id="desc">Graded blind against a fixed key, 3 votes per answer, 5 answers per task, arm and model. Found all 3 planted defects: Opus 5.5 without Compound 5, with Compound 5 of 5. Sonnet 5.5 without Compound 5, with Compound 5 of 5. Covered all 11 key points: Opus 5.5 without Compound 4, with Compound 5 of 5. Sonnet 5.5 without Compound 0, with Compound 0 of 5. Key points covered, median answer: Opus 5.5 without Compound 11, with Compound 11 of 11. Sonnet 5.5 without Compound 9, with Compound 9 of 11. Incorrect statements, all 10 answers: Opus 5.5 without Compound 3, with Compound 3. Sonnet 5.5 without Compound 5, with Compound 9. The judge (Claude Opus 5.5) saw the question, the key and the answer, never the arm; a point counted only with a verbatim quote from the answer. Incorrect statements exclude 40 votes that called the reviewed commit&#x27;s id wrong, a harness error since fixed. Orange: more with Compound. Claude Code 2.1.316 · Compound 0.14.0 · 31 Oct 2026.</desc>
