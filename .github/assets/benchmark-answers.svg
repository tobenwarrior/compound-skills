<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="967" viewBox="0 0 1040 967" role="img" aria-labelledby="title desc">
  <title id="title">Reviews and questions: no measured gain</title>
  <desc id="desc">Reviews and questions: no measured gain. A blind judge, Claude Opus 5.5, graded every Flask review and Django answer against a fixed key: 10 per task, arm and model, from two runs of Compound Skills 0.14.0 on the same day. Found all 3 defects: Opus stock 10 of 10, Opus with Compound 10 of 10, Sonnet stock 10 of 10, Sonnet with Compound 10 of 10. Incorrect statements in the 10 reviews: Opus stock 6, Opus with Compound 3, Sonnet stock 5, Sonnet with Compound 5. Median cost of a review: Opus stock 11¢, Opus with Compound 20¢, Sonnet stock 2.6¢, Sonnet with Compound 7.3¢. Covered all 11 key points: Opus stock 9 of 10, Opus with Compound 7 of 10, Sonnet stock 0 of 10, Sonnet with Compound 0 of 10. Median key points covered: Opus stock 11 of 11, Opus with Compound 11 of 11, Sonnet stock 9 of 11, Sonnet with Compound 9 of 11. Incorrect statements in the 10 answers: Opus stock 7, Opus with Compound 6, Sonnet stock 7, Sonnet with Compound 10. Median cost of an answer: Opus stock 15¢, Opus with Compound 19¢, Sonnet stock 3.8¢, Sonnet with Compound 6.8¢. Every arm could read the code but not run it. The first run took three votes per answer and the second one; 40 votes in the first run that called the commit id wrong, because the judge's copy showed an old id, are not counted.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
