<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="952" viewBox="0 0 1280 952" role="img" aria-labelledby="title desc">
<title id="title">Same agent. Better habits.</title>
<desc id="desc">Workflow comparison. Finding the right code: without Compound, It searches and opens files as it goes; with Compound, Starts from a map of the files, symbols, and imports behind your task. Fixing a bug: without Compound, You spell out the steps, or it picks its own; with Compound, Reproduce, find the cause, add a regression test, re-run the failure. Refactoring: without Compound, You ask it to confirm nothing changed; with Compound, Records behavior first, then proves it still matches. Saying “done”: without Compound, You ask what was actually tested; with Compound, Reports what ran, what it proved, and what is still unverified. Commits and PRs: without Compound, You restate your style each time; with Compound, Clear titles, real check results, no AI co-author lines. Joining an old project: without Compound, Cleanup happens if you ask for it; with Compound, First edit starts a check-up with verified, high-confidence cleanup. Every new chat: without Compound, You repeat your preferences; with Compound, Set up once for Codex, Cursor, and Claude Code.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161c}
.title{font-size:40px;font-weight:700;letter-spacing:-.04em}
.sub{font-size:18px;fill:#6b6f78}
.head{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#6b6f78}
.headg{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#147a43}
.task{font-size:19px;font-weight:650;letter-spacing:-.01em}
.without{font-size:16px;fill:#6b6f78}
.with{font-size:16px;font-weight:550}
.badge{font-size:13px;font-weight:650;fill:#147a43}
.label{font-size:19px;font-weight:600}
.value{font-size:26px;font-weight:700;letter-spacing:-.03em}
.green{fill:#147a43}
.note{font-size:16px;fill:#6b6f78}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#14161c}
</style>
<rect width="1280" height="952" rx="28" fill="#fdf8ee"/>
<rect width="1280" height="952" rx="28" fill="url(#glowGreen)"/>
<rect width="1280" height="952" rx="28" fill="url(#glowGold)"/>
<rect x="40" y="36" width="1200" height="118" rx="24" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="76" y="88" class="title">Same agent. Better habits.</text>
<text x="76" y="124" class="sub">What changes in the workflow when Compound is on. A comparison of steps, not of speed.</text>
