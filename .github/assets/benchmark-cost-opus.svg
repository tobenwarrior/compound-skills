<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="792" viewBox="0 0 1280 792" role="img" aria-labelledby="title desc">
<title id="title">Tokens, cost and time with Compound</title>
<desc id="desc">Bug: refund split: tokens 1.42 times (pairs ranged 1.10 to 1.83), cost 1.53 times (1.30 to 2.00), time 1.42 times (1.10 to 2.23), 8 pairs. Bug: leap-year proration: tokens 1.45 times (pairs ranged 1.13 to 1.78), cost 1.45 times (1.27 to 2.15), time 1.37 times (0.90 to 2.41), 8 pairs. Bug: December due date: tokens 1.45 times (pairs ranged 1.01 to 1.53), cost 1.97 times (1.69 to 2.47), time 1.60 times (1.09 to 1.90), 8 pairs. Refactor: rounding helpers: tokens 1.05 times (pairs ranged 0.77 to 1.60), cost 1.04 times (0.83 to 1.21), time 1.07 times (0.82 to 1.27), 8 pairs. Review a Flask commit: tokens 1.60 times (pairs ranged 1.48 to 2.28), cost 1.58 times (1.39 to 1.96), time 1.31 times (0.75 to 1.51), 8 pairs. Question about Django: tokens 0.84 times (pairs ranged 0.70 to 1.07), cost 0.88 times (0.71 to 1.03), time 0.92 times (0.82 to 1.08), 8 pairs. Dot: median of the 8 pairs. Line: lowest to highest pair. Cost: the API list price the client reported. Over all six tasks Compound used 1.28× the tokens (95% interval 1.22–1.34) and 1.38× the cost (1.33–1.44). Always loaded: +369 tokens per request (18,590 → 18,959).</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
