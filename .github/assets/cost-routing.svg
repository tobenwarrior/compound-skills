<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">Spend less on routine startup.</title><desc id="desc">Without Compound, earlier Compound, and selective routing on the same twelve bugs per model. Selective routing costs 19.9% less than earlier Compound with Opus and 17.9% less with Sonnet. Hidden-test pass counts remain 10/12 and 9/12 respectively. Stock costs less than both.</desc><defs><radialGradient id="wash"><stop stop-color="#e5f3e9"/><stop offset="1" stop-color="#fdf8ee"/></radialGradient></defs><rect width="900" height="690" rx="28" fill="url(#wash)"/><g font-family="Inter,system-ui,sans-serif"><rect x="24" y="24" width="852" height="110" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="48" y="67" font-size="28" font-weight="700" fill="#14161c">Spend less on routine startup.</text><text x="48" y="103" font-size="15" font-weight="400" fill="#6b6f78">Saved real-bug runs · mean API list-price estimate per attempt · lower is better</text><rect x="24" y="154" width="414" height="384" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="48" y="193" font-size="22" font-weight="700" fill="#14161c">Claude Opus 5.5</text><text x="48" y="236" font-size="15" font-weight="600" fill="#14161c">Without Compound</text><text x="339" y="236" font-size="20" font-weight="700" fill="#6b6f78">21.4¢</text><rect x="48" y="249" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="48" y="249" width="171.84493228235183" height="16" rx="8" fill="#9a9e95"/><text x="48" y="311" font-size="15" font-weight="600" fill="#14161c">Earlier Compound</text><text x="339" y="311" font-size="20" font-weight="700" fill="#6b6f78">30.6¢</text><rect x="48" y="324" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="48" y="324" width="245.53571428571428" height="16" rx="8" fill="#b9c1b6"/><text x="48" y="386" font-size="15" font-weight="600" fill="#14161c">Selective Compound</text><text x="339" y="386" font-size="20" font-weight="700" fill="#147a43">24.5¢</text><rect x="48" y="399" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="48" y="399" width="196.75963710205028" height="16" rx="8" fill="#147a43"/><text x="48" y="477" font-size="19" font-weight="700" fill="#147a43">19.9% less vs earlier Compound</text><text x="48" y="510" font-size="14" font-weight="400" fill="#6b6f78">Hidden passes: 10/12 → 10/12 → 10/12</text><rect x="462" y="154" width="414" height="384" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="486" y="193" font-size="22" font-weight="700" fill="#14161c">Claude Sonnet 5.5</text><text x="486" y="236" font-size="15" font-weight="600" fill="#14161c">Without Compound</text><text x="777" y="236" font-size="20" font-weight="700" fill="#6b6f78">7.3¢</text><rect x="486" y="249" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="486" y="249" width="166.14858068208235" height="16" rx="8" fill="#9a9e95"/><text x="486" y="311" font-size="15" font-weight="600" fill="#14161c">Earlier Compound</text><text x="777" y="311" font-size="20" font-weight="700" fill="#6b6f78">10.8¢</text><rect x="486" y="324" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="486" y="324" width="245.53571428571428" height="16" rx="8" fill="#b9c1b6"/><text x="486" y="386" font-size="15" font-weight="600" fill="#14161c">Selective Compound</text><text x="777" y="386" font-size="20" font-weight="700" fill="#147a43">8.9¢</text><rect x="486" y="399" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="486" y="399" width="201.70026594375685" height="16" rx="8" fill="#147a43"/><text x="486" y="477" font-size="19" font-weight="700" fill="#147a43">17.9% less vs earlier Compound</text><text x="486" y="510" font-size="14" font-weight="400" fill="#6b6f78">Hidden passes: 10/12 → 9/12 → 9/12</text><text x="48" y="581" font-size="16" font-weight="600" fill="#14161c">Same bugs, prompt hashes, permission settings and served models.</text><text x="48" y="612" font-size="15" font-weight="400" fill="#6b6f78">24 attempts per mode across both models; 1 saved run per bug and model.</text><text x="48" y="642" font-size="15" font-weight="400" fill="#6b6f78">Arithmetic cohort means, including failed attempts. Stock remains cheaper up front.</text><text x="48" y="667" font-size="14" font-weight="400" fill="#6b6f78">Claude Code 2.1.312 · 1 Nov 2026 · recorded 0.16.0 routing; no new model runs.</text></g></svg>
