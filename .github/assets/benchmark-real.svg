<svg xmlns="http://www.w3.org/2000/svg" width="700" height="797" viewBox="0 0 700 797" role="img" aria-labelledby="title desc">
<title id="title">12 real bugs, fixed upstream in 2026</title>
<desc id="desc">12 real bugs, fixed upstream in 2026. Flask, click, attrs, packaging and marshmallow at the commit before each fix, with the fix&#x27;s own tests hidden; the report describes only the symptom. Stock Claude Code against Compound Skills 0.14.0, side by side. Fixed the bug (upstream&#x27;s tests pass): Opus stock 23 of 28, Opus with Compound 23 of 28, Sonnet stock 23 of 28, Sonnet with Compound 21 of 28. Fixed it and the project&#x27;s whole suite passes: Opus stock 23 of 28, Opus with Compound 23 of 28, Sonnet stock 23 of 28, Sonnet with Compound 21 of 28. Left a test that fails on the buggy code: Opus stock 28 of 28, Opus with Compound 27 of 28, Sonnet stock 26 of 28, Sonnet with Compound 28 of 28. Reproduced the bug before changing code: Opus stock 5 of 28, Opus with Compound 28 of 28, Sonnet stock 0 of 28, Sonnet with Compound 26 of 28. Showed a new test failing before the fix: Opus stock 0 of 28, Opus with Compound 28 of 28, Sonnet stock 0 of 28, Sonnet with Compound 26 of 28. Ran the whole suite on the final code: Opus stock 19 of 28, Opus with Compound 22 of 28, Sonnet stock 8 of 28, Sonnet with Compound 25 of 28. Committed without an AI co-author line: Opus stock 0 of 28, Opus with Compound 28 of 28, Sonnet stock 0 of 28, Sonnet with Compound 28 of 28. Median cost of a fix: Opus stock 19¢, Opus with Compound 28¢, Sonnet stock 7.1¢, Sonnet with Compound 9.7¢. The first four bugs (Flask and click, fixed July to September) ran 3 times per arm and model; eight more (attrs, packaging, marshmallow, fixed August to October) were frozen before any run and ran twice. Without Compound, the new test was shown failing on the unfixed code only after the fix, with the fix set aside: in 20 Opus runs and 4 Sonnet runs.</desc>
