<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="794" viewBox="0 0 1280 794" role="img" aria-labelledby="title desc">
<title id="title">Fast on real repositories</title>
<desc id="desc">Gin · Go (130 files): first build 0.42 s, unchanged 0.04 s, after editing its most-imported file 0.05 s, agent query cold 0.95 s and warm 0.31 s. click · Python (178 files): first build 0.37 s, unchanged 0.07 s, after editing its most-imported file 0.08 s, agent query cold 0.94 s and warm 0.32 s. ripgrep · Rust (226 files): first build 2.09 s, unchanged 0.08 s, after editing its most-imported file 0.11 s, agent query cold 2.73 s and warm 0.34 s. Flask · Python (236 files): first build 0.26 s, unchanged 0.10 s, after editing its most-imported file 0.10 s, agent query cold 0.83 s and warm 0.32 s. Hono · TypeScript (583 files): first build 0.69 s, unchanged 0.16 s, after editing its most-imported file 0.18 s, agent query cold 1.39 s and warm 0.34 s. Vue core · TypeScript (703 files): first build 1.11 s, unchanged 0.23 s, after editing its most-imported file 0.23 s, agent query cold 1.86 s and warm 0.33 s. Django · Python (7085 files): first build 8.13 s, unchanged 1.96 s, after editing its most-imported file 2.04 s, agent query cold 9.76 s and warm 0.89 s. One file edited: the file most other files import. Agent query: the exact command the skill runs; cold includes starting the local service and indexing. The map keeps its data in your user cache, outside the repository.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
