<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="818" viewBox="0 0 1280 818" role="img" aria-labelledby="title desc">
<title id="title">Fast on real repositories</title>
<desc id="desc">Gin · Go (130 files): first build 0.42 s, unchanged 0.05 s, after editing its most-imported file 0.06 s, coding-task query cold 1.09 s and warm 0.38 s, read-only query 0.64 s. click · Python (178 files): first build 0.61 s, unchanged 0.09 s, after editing its most-imported file 0.11 s, coding-task query cold 1.20 s and warm 0.42 s, read-only query 0.70 s. ripgrep · Rust (226 files): first build 2.48 s, unchanged 0.10 s, after editing its most-imported file 0.19 s, coding-task query cold 3.17 s and warm 0.43 s, read-only query 2.61 s. Flask · Python (236 files): first build 0.41 s, unchanged 0.12 s, after editing its most-imported file 0.14 s, coding-task query cold 1.09 s and warm 0.40 s, read-only query 0.47 s. Hono · TypeScript (583 files): first build 0.97 s, unchanged 0.23 s, after editing its most-imported file 0.19 s, coding-task query cold 1.74 s and warm 0.41 s, read-only query 1.11 s. Vue core · TypeScript (703 files): first build 1.24 s, unchanged 0.27 s, after editing its most-imported file 0.26 s, coding-task query cold 2.00 s and warm 0.42 s, read-only query 1.40 s. Django · Python (7085 files): first build 8.20 s, unchanged 2.29 s, after editing its most-imported file 2.38 s, coding-task query cold 10.90 s and warm 0.97 s, read-only query 8.78 s. One file edited: the file most other files import. Coding query: the command the skill gives the agent when edits are allowed; cold includes starting the local service and indexing. Read-only query: the command for questions and reviews, which starts no service and writes no cache; timed here with no cache yet. The map keeps its data in your user cache. Timed on the current map, whose newer ranking made queries slower than in 0.12.1 timed the same way: 0.03 to 0.09 s warm, 0.04 to 1.19 s cold.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
