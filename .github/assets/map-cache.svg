<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
<title id="title">The map is reused, not rebuilt</title>
<desc id="desc">Code map build time, median of 5 runs on a 103-file test repository: first run 0.094 seconds reading all 103 files; run again 0.033 seconds reading 0 files; after editing one file 0.037 seconds reading 1 file. This compares Compound with itself, not an agent with versus without Compound.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161c}
.title{font-size:40px;font-weight:700;letter-spacing:-.04em}
.sub{font-size:18px;fill:#6b6f78}
.head{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#6b6f78}
.headg{font-size:13px;font-weight:700;letter-spacing:.12em;fill:#147a43}
.task{font-size:19px;font-weight:650;letter-spacing:-.01em}
.without{font-size:16px;fill:#6b6f78}
.with{font-size:16px;font-weight:550}
.badge{font-size:13px;font-weight:650;fill:#147a43}
.label{font-size:19px;font-weight:600}
.value{font-size:26px;font-weight:700;letter-spacing:-.03em}
.green{fill:#147a43}
.note{font-size:16px;fill:#6b6f78}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#14161c}
</style>
<rect width="1280" height="580" rx="28" fill="#fdf8ee"/>
<rect width="1280" height="580" rx="28" fill="url(#glowGreen)"/>
<rect width="1280" height="580" rx="28" fill="url(#glowGold)"/>
<rect x="40" y="36" width="1200" height="118" rx="24" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="76" y="88" class="title">The map is reused, not rebuilt</text>
<text x="76" y="124" class="sub">Median of 5 runs on a 103-file test repository · Linux x86-64 · Python 3.13</text>
<rect x="1103" y="70" width="101" height="34" rx="17" fill="#e5f3e9" stroke="#d3e8d8"/>
<circle cx="1123" cy="87" r="5" fill="#4ade80"/>
<text x="1137" y="92" class="badge">Measured</text>
<rect x="40" y="176" width="1200" height="270" rx="24" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="76" y="222" class="label">Time to build the code map <tspan class="note">· lower is better</tspan></text>
<text x="76" y="284" class="label">First run</text>
<rect x="330" y="262" width="470" height="30" rx="15" fill="#f0ede6"/>
<rect x="330" y="262" width="443.0" height="30" rx="15" fill="#a7aaa1"/>
<text x="822" y="287" class="value">0.094 s</text>
<text x="960" y="284" class="note">reads all 103 files</text>
<text x="76" y="342" class="label">Run again</text>
<rect x="330" y="320" width="470" height="30" rx="15" fill="#f0ede6"/>
<rect x="330" y="320" width="156.8" height="30" rx="15" fill="url(#accent)"/>
<text x="822" y="345" class="value green">0.033 s</text>
<text x="960" y="342" class="note">reads 0 files</text>
<text x="76" y="400" class="label">After editing 1 file</text>
<rect x="330" y="378" width="470" height="30" rx="15" fill="#f0ede6"/>
<rect x="330" y="378" width="175.3" height="30" rx="15" fill="url(#accent)"/>
<text x="822" y="403" class="value green">0.037 s</text>
<text x="960" y="400" class="note">reads 1 file</text>
<rect x="40" y="466" width="1200" height="82" rx="24" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="76" y="500" class="note">Compares Compound with itself. It does not measure an agent working with versus without Compound.</text>
<text x="76" y="528" class="mono">python3 -B scripts/benchmark_code_map.py --files-per-language 20 --repetitions 3</text>
</svg>
