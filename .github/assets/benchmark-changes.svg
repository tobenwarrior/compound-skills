<title id="title">What changed in 0.14.0</title>
<desc id="desc">Same runs, 5 paired runs per task and model: without Compound, with 0.13.0 and with 0.14.0. Reproduced the bug before changing code: Opus 5.5 without Compound 0 of 15, with 0.13.0 11, with 0.14.0 15. Sonnet 5.5 without Compound 0 of 15, with 0.13.0 1, with 0.14.0 15. Showed a test failing on the unfixed code: Opus 5.5 without Compound 0 of 15, with 0.13.0 14, with 0.14.0 15. Sonnet 5.5 without Compound 0 of 15, with 0.13.0 7, with 0.14.0 15. Planted regressions caught by the tests it left: Opus 5.5 without Compound 40 of 55, with 0.13.0 41, with 0.14.0 49. Sonnet 5.5 without Compound 29 of 55, with 0.13.0 36, with 0.14.0 42. Refactor done safely: both helpers gone, tax rounding kept: Opus 5.5 without Compound 2 of 5, with 0.13.0 2, with 0.14.0 5. Sonnet 5.5 without Compound 0 of 5, with 0.13.0 0, with 0.14.0 5. Cost of 0.14.0 against 0.13.0, six tasks weighted equally, with 95% intervals: Opus 5.5: 1.09× the tokens (1.02–1.16) and 1.06× the list-price cost (1.01–1.11) of 0.13.0. Sonnet 5.5: 1.03× the tokens (0.96–1.12) and 1.03× the list-price cost (0.95–1.11) of 0.13.0. 0.14.0 adds one sentence to the always-on rule: reproduce a reported bug and show its test failing before fixing it, and pin current behavior before a refactor. Always loaded: 378 tokens per request with 0.13.0, 418 with 0.14.0. Claude Code 2.1.316 · Compound 0.14.0 · 31 Oct 2026.</desc>
