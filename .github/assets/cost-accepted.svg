<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" role="img" aria-labelledby="title desc"><title id="title">Count accepted results, including failures.</title><desc id="desc">Six attempts per mode and model. Without Compound four pass, with Compound six pass. Opus spend per accepted result 24.3 versus 26.7 cents. Sonnet 9.87 versus 10.11 cents. Tests detect 0/36 versus 36/36 planted wrong refactors across both models. Later repair costs were not measured.</desc><defs><radialGradient id="wash"><stop stop-color="#e5f3e9"/><stop offset="1" stop-color="#fdf8ee"/></radialGradient></defs><rect width="900" height="688" rx="28" fill="url(#wash)"/><g font-family="Inter,system-ui,sans-serif"><rect x="24" y="24" width="852" height="110" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="48" y="67" font-size="28" font-weight="700" fill="#14161c">Count accepted results, including failures.</text><text x="48" y="103" font-size="15" font-weight="400" fill="#6b6f78">Saved held-out refactors · API list-price spend ÷ accepted results</text><rect x="24" y="154" width="414" height="309" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="48" y="193" font-size="22" font-weight="700" fill="#14161c">Claude Opus 5.5</text><text x="48" y="246" font-size="15" font-weight="600" fill="#14161c">Without Compound</text><text x="339" y="246" font-size="20" font-weight="700" fill="#6b6f78">24.3¢</text><rect x="48" y="259" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="48" y="259" width="227.494156561023" height="16" rx="8" fill="#9a9e95"/><text x="48" y="333" font-size="15" font-weight="600" fill="#14161c">With Compound</text><text x="339" y="333" font-size="20" font-weight="700" fill="#147a43">26.7¢</text><rect x="48" y="346" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="48" y="346" width="249.99999999999997" height="16" rx="8" fill="#147a43"/><text x="48" y="425" font-size="17" font-weight="700" fill="#147a43">Accepted: 4/6 without · 6/6 with</text><rect x="462" y="154" width="414" height="309" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="486" y="193" font-size="22" font-weight="700" fill="#14161c">Claude Sonnet 5.5</text><text x="486" y="246" font-size="15" font-weight="600" fill="#14161c">Without Compound</text><text x="777" y="246" font-size="20" font-weight="700" fill="#6b6f78">9.87¢</text><rect x="486" y="259" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="486" y="259" width="244.01452420673647" height="16" rx="8" fill="#9a9e95"/><text x="486" y="333" font-size="15" font-weight="600" fill="#14161c">With Compound</text><text x="777" y="333" font-size="20" font-weight="700" fill="#147a43">10.11¢</text><rect x="486" y="346" width="275" height="16" rx="8" fill="#f7f6f2"/><rect x="486" y="346" width="249.99999999999997" height="16" rx="8" fill="#147a43"/><text x="486" y="425" font-size="17" font-weight="700" fill="#147a43">Accepted: 4/6 without · 6/6 with</text><rect x="24" y="483" width="852" height="124" rx="24" fill="#fffdf8" stroke="#ece6d8"/><text x="48" y="521" font-size="19" font-weight="700" fill="#14161c">Tests left behind detect planted wrong refactors</text><text x="48" y="568" font-size="22" font-weight="700" fill="#6b6f78">Without Compound: 0/36</text><text x="468" y="568" font-size="22" font-weight="700" fill="#147a43">With Compound: 36/36</text><text x="48" y="641" font-size="15" font-weight="400" fill="#6b6f78">All attempt spend stays in the numerator. Compound still costs slightly more.</text><text x="48" y="669" font-size="14" font-weight="400" fill="#6b6f78">3 held-out refactors · 2 repetitions per model · fixture mutations, not future incidents.</text></g></svg>
