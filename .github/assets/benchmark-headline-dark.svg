<text x="28.0" y="146.0" font-size="20" font-weight="600">Reproduced the bug before changing code</text>
<rect x="28.0" y="179.0" width="300.0" height="6.0" rx="3" fill="#151b23"/>
<line x1="46.0" y1="182.0" x2="226.2" y2="182.0" stroke="#3fb950" stroke-width="2" stroke-opacity="0.55"/>
