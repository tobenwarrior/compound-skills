<svg xmlns="http://www.w3.org/2000/svg" width="600" height="643" viewBox="0 0 600 643" role="img" aria-labelledby="title desc">
<title id="title">Compound in Claude Code: the headline result</title>
<desc id="desc">With and without Compound, in Claude Code: three clearly reported bugs, 15 paired runs per arm and model. Reproduced the bug before changing code: Claude Opus 5.5 0 of 15 without Compound and 15 of 15 with it. Claude Sonnet 5.5 0 of 15 without Compound and 14 of 15 with it. Showed a test failing on the unfixed code: Claude Opus 5.5 0 of 15 without Compound and 15 of 15 with it. Claude Sonnet 5.5 0 of 15 without Compound and 14 of 15 with it. Claude Opus 5.5&#x27;s median fix for each bug took 1.14–1.50× the tokens and 1.37–1.56× the list-price cost. Claude Sonnet 5.5&#x27;s median fix for each bug took 1.01–1.36× the tokens and 1.14–1.75× the list-price cost. Every run fixed its bug, with or without Compound. Compound 0.14.0 in Claude Code 2.1.316 (31 October 2026); Codex and Cursor use the same guides.</desc>
