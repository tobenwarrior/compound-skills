<svg xmlns="http://www.w3.org/2000/svg" width="700" height="606" viewBox="0 0 700 606" role="img" aria-labelledby="title desc">
<title id="title">Does the map query pay for itself?</title>
<desc id="desc">Does the map query pay for itself? Compound before its 0.16.0 redesign, which loaded the skill for every task, against the same text with the map query removed from its startup and its rule, on the 12 real bugs and 3 held-out refactors, side by side. Real bugs fixed: Opus Compound 20 of 24, Opus Compound without the map query 20 of 24, Sonnet Compound 19 of 24, Sonnet Compound without the map query 18 of 24. Refactors done correctly: Opus Compound 15 of 15, Opus Compound without the map query 15 of 15, Sonnet Compound 15 of 15, Sonnet Compound without the map query 15 of 15. Real bugs reproduced first: Opus Compound 24 of 24, Opus Compound without the map query 24 of 24, Sonnet Compound 24 of 24, Sonnet Compound without the map query 24 of 24. New test failing before the fix: Opus Compound 24 of 24, Opus Compound without the map query 24 of 24, Sonnet Compound 24 of 24, Sonnet Compound without the map query 24 of 24. Median cost of a real fix: Opus Compound 28¢, Opus Compound without the map query 27¢, Sonnet Compound 10¢, Sonnet Compound without the map query 11¢. Median cost of a refactor: Opus Compound 24¢, Opus Compound without the map query 21¢, Sonnet Compound 9.6¢, Sonnet Compound without the map query 9.8¢. The decision rule was fixed before the run; see the text.</desc>
