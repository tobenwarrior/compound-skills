<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="756" viewBox="0 0 1040 756" role="img" aria-labelledby="title desc">
  <title id="title">Correctness and work performed</title>
  <desc id="desc">Two-task pilot: without Compound $0.02106263, with Compound $0.0189328 of Go allowance; 10.1% less in the matched total. Both modes passed 2/2 tasks. Model requests: 21 without, 29 with. API cash charge $0 both on the Go subscription. One refund task cost more with Compound. No long-term savings measured.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
