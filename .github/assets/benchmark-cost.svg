<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title desc">
<title id="title">What it costs per task</title>
<desc id="desc">What it costs per task. Median list-price cost and time per run on the six controlled tasks and a plain question, with and without Compound Skills 0.14.0: 10 runs per task, arm and model, from two runs on the same day. Claude Opus 5.5: Bug: refund split 12.4¢ and 30 s without, 18.7¢ and 35 s with Compound; Bug: leap-year proration 10.7¢ and 23 s without, 17.1¢ and 36 s with Compound; Bug: December due date 8.9¢ and 22 s without, 15.8¢ and 38 s with Compound; Refactor: rounding helpers 16.6¢ and 33 s without, 25.1¢ and 46 s with Compound; Review a Flask commit 11.2¢ and 32 s without, 20.5¢ and 50 s with Compound; Question about Django 15.4¢ and 29 s without, 18.7¢ and 44 s with Compound; Plain Python question 0.6¢ and 3 s without, 0.7¢ and 4 s with Compound. Claude Sonnet 5.5: Bug: refund split 5.4¢ and 23 s without, 7.3¢ and 28 s with Compound; Bug: leap-year proration 4.2¢ and 17 s without, 7.2¢ and 26 s with Compound; Bug: December due date 3.5¢ and 15 s without, 4.8¢ and 21 s with Compound; Refactor: rounding helpers 5.4¢ and 21 s without, 8.5¢ and 29 s with Compound; Review a Flask commit 2.6¢ and 17 s without, 7.3¢ and 32 s with Compound; Question about Django 3.8¢ and 17 s without, 6.8¢ and 33 s with Compound; Plain Python question 0.3¢ and 4 s without, 0.3¢ and 4 s with Compound. Right: the extra cents per run and the ratio of the two medians. Across the six tasks weighted equally, paired runs cost 1.55× with Opus and 1.68× with Sonnet.</desc>
