<text x="232.9" y="104.0" font-size="15" fill="#59636e">With Compound</text>
<text x="28.0" y="146.0" font-size="20" font-weight="600">Reproduced the bug before changing code</text>
<rect x="28.0" y="179.0" width="300.0" height="6.0" rx="3" fill="#eff2f5"/>
