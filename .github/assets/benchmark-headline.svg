<path d="M292.2,270.0 L297.2,274.0 L292.2,278.0" fill="none" stroke="#147a43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.55"/>
<circle cx="47.8" cy="274.0" r="9" fill="none" stroke="#818b98" stroke-width="2"/>
<circle cx="308.2" cy="274.0" r="8" fill="#147a43" stroke="#ffffff" stroke-width="2"/>
<text x="572" y="287.0" text-anchor="end"><tspan font-size="36" font-weight="600">1 → 23</tspan><tspan font-size="18" fill="#59636e"> of 24</tspan></text>
