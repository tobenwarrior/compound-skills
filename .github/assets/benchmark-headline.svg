<svg xmlns="http://www.w3.org/2000/svg" width="600" height="537" viewBox="0 0 600 537" role="img" aria-labelledby="title desc">
<title id="title">Compound in Claude Code: the headline result</title>
<desc id="desc">Claude Opus 5.5, with and without Compound, three clearly reported bugs, 24 paired runs per arm. Reproduced the bug before changing code: without Compound 0 of 24, with Compound 17 of 24. Showed a test failing on the unfixed code: without Compound 1 of 24, with Compound 23 of 24. Every run fixed its bug, with or without Compound. The median fix for each bug took 1.42–1.45× the tokens and 1.45–1.97× the list-price cost; single fixes cost 1.27× to 2.47×. Claude Sonnet 5.5: 0 to 4 and 0 to 5 of 24, no clear difference. Run in Claude Code 2.1.314 (31 October 2026); Codex and Cursor use the same guides.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style>
