<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1012" viewBox="0 0 1040 1012" role="img" aria-labelledby="title desc">
  <title id="title">Bug fixes: evidence before source edits</title>
  <desc id="desc">Compound 0.16.0 · 12 upstream bugs · 24 runs per mode and model · Claude Code. Hidden upstream fix tests pass · higher is better: Claude Opus 5.5 without 20, with 20/24; Claude Sonnet 5.5 without 19, with 18/24. New test shown failing before fix · higher is better: Claude Opus 5.5 without 1, with 24/24; Claude Sonnet 5.5 without 0, with 24/24. Whole suite run on final code · higher is better: Claude Opus 5.5 without 18, with 22/24; Claude Sonnet 5.5 without 10, with 24/24. Task-weighted API cost · lower is better: Claude Opus 5.5 without 1, with 1.09×; Claude Sonnet 5.5 without 1, with 1.14×. Cost ratios compare matched tasks with tasks weighted equally. Without Compound = 1×. Verification improved much more than fix success. Later prompt changes are not measured here.</desc>
