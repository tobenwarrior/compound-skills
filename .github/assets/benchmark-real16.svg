<svg xmlns="http://www.w3.org/2000/svg" width="760" height="784" viewBox="0 0 760 784" role="img" aria-labelledby="title desc">
<title id="title">12 real bugs: stock, a plain rule and Compound</title>
<desc id="desc">12 real bugs: stock, a plain rule and Compound. Flask, click, attrs, packaging and marshmallow at the commit before each upstream fix, with the fix&#x27;s own tests hidden; the report describes only the symptom. 2 runs per bug, arm and model; Compound Skills 0.16.0 ran just after stock and the rule, on the same tasks. Fixed the bug (upstream&#x27;s tests pass): Opus stock 20 of 24, Opus plain rule 20 of 24, Opus Compound 20 of 24, Sonnet stock 19 of 24, Sonnet plain rule 18 of 24, Sonnet Compound 18 of 24. Left a test that fails on the buggy code: Opus stock 23 of 24, Opus plain rule 22 of 24, Opus Compound 23 of 24, Sonnet stock 22 of 24, Sonnet plain rule 21 of 24, Sonnet Compound 24 of 24. Reproduced the bug before changing code: Opus stock 2 of 24, Opus plain rule 24 of 24, Opus Compound 24 of 24, Sonnet stock 0 of 24, Sonnet plain rule 21 of 24, Sonnet Compound 24 of 24. Showed a new test failing before the fix: Opus stock 1 of 24, Opus plain rule 24 of 24, Opus Compound 24 of 24, Sonnet stock 0 of 24, Sonnet plain rule 18 of 24, Sonnet Compound 24 of 24. Ran the whole suite on the final code: Opus stock 18 of 24, Opus plain rule 23 of 24, Opus Compound 22 of 24, Sonnet stock 10 of 24, Sonnet plain rule 24 of 24, Sonnet Compound 24 of 24. Committed without an AI co-author line: Opus stock 0 of 24, Opus plain rule 0 of 24, Opus Compound 24 of 24, Sonnet stock 0 of 24, Sonnet plain rule 0 of 24, Sonnet Compound 24 of 24. Median cost of a fix: Opus stock 21¢, Opus plain rule 25¢, Opus Compound 20¢, Sonnet stock 7.0¢, Sonnet plain rule 7.8¢, Sonnet Compound 7.7¢. Cost against stock, bug by bug: Opus stock 1×, Opus plain rule 1.23×, Opus Compound 1.09×, Sonnet stock 1×, Sonnet plain rule 1.09×, Sonnet Compound 1.14×. The plain rule is a five-sentence user rule asking for the habits scored here. Stock and the rule kept Claude Code&#x27;s default co-author line; its attribution setting can remove it without a plugin. The multiples compare each bug&#x27;s runs with stock&#x27;s, with the bugs weighted equally, so they can differ from the medians.</desc>
