<svg xmlns="http://www.w3.org/2000/svg" width="840" height="812" viewBox="0 0 840 812" role="img" aria-labelledby="title desc">
<title id="title">Real bugs in Flask and click</title>
<desc id="desc">Four bugs Flask and click fixed upstream in July to September 2026, 3 runs per bug, arm and model. Reproduced the bug before changing code: Opus 5.5 without Compound 5 of 12, with Compound 10 of 12. Sonnet 5.5 without Compound 0 of 12, with Compound 12 of 12. Showed a test failing on the unfixed code: Opus 5.5 without Compound 8 of 12, with Compound 12 of 12. Sonnet 5.5 without Compound 3 of 12, with Compound 12 of 12. Ran the whole test suite on the final code: Opus 5.5 without Compound 8 of 12, with Compound 10 of 12. Sonnet 5.5 without Compound 3 of 12, with Compound 11 of 12. Upstream&#x27;s hidden tests pass: Opus 5.5 without Compound 9 of 12, with Compound 9 of 12. Sonnet 5.5 without Compound 9 of 12, with Compound 9 of 12. Left a test that fails on the buggy code: Opus 5.5 without Compound 12 of 12, with Compound 11 of 12. Sonnet 5.5 without Compound 10 of 12, with Compound 12 of 12. Fixed, Flask: app.run() with an IPv6 SERVER_NAME: Opus 5.5 without Compound 3 of 3, with Compound 3 of 3. Sonnet 5.5 without Compound 3 of 3, with Compound 3 of 3. Fixed, Flask: session with an IPv6 base_url: Opus 5.5 without Compound 3 of 3, with Compound 3 of 3. Sonnet 5.5 without Compound 3 of 3, with Compound 3 of 3. Fixed, click: pickling an option: Opus 5.5 without Compound 3 of 3, with Compound 3 of 3. Sonnet 5.5 without Compound 3 of 3, with Compound 3 of 3. Fixed, click: progress bar stops at 14/20: Opus 5.5 without Compound 0 of 3, with Compound 0 of 3. Sonnet 5.5 without Compound 0 of 3, with Compound 0 of 3. Cost with Compound, four bugs weighted equally, with 95% intervals: Opus 5.5: 1.43× the tokens (1.22–1.66) and 1.51× the list-price cost (1.31–1.75). Sonnet 5.5: 1.34× the tokens (1.19–1.50) and 1.38× the list-price cost (1.22–1.56). Each run got the project at the parent of the upstream fix, with its history and test suite, and a report of the symptom only. Upstream&#x27;s tests for the progress bar also cover bar.update(), which no run fixed. Claude Code 2.1.316 · Compound 0.14.0 · 31 Oct 2026.</desc>
