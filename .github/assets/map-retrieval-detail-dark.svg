<title id="title">The map&#x27;s top 4 and top 12, by repository</title>
<desc id="desc">Share of each commit&#x27;s changed source files in the map&#x27;s top 4 (solid) and top 12 (light), querying with the commit&#x27;s title; 60 commits per repository. Flask (Python; 2023-03-04 to 2024-10-18; 82 code files to choose from): Code map 60% in the top 4 and 96% in the top 12, Map in 0.12.1 24% in the top 4 and 37% in the top 12, Word-count search 35% in the top 4 and 74% in the top 12, Random 5% in the top 4 and 15% in the top 12. Click (Python; 2025-05-25 to 2026-05-23; 63 code files to choose from): Code map 81% in the top 4 and 95% in the top 12, Map in 0.12.1 49% in the top 4 and 71% in the top 12, Word-count search 73% in the top 4 and 92% in the top 12, Random 6% in the top 4 and 19% in the top 12. Hono (TypeScript; 2026-07-21 to 2026-08-22; 388 code files to choose from): Code map 75% in the top 4 and 90% in the top 12, Map in 0.12.1 57% in the top 4 and 74% in the top 12, Word-count search 34% in the top 4 and 55% in the top 12, Random 1% in the top 4 and 3% in the top 12. Gin (Go; 2025-10-08 to 2026-10-10; 98 code files to choose from; not used for tuning): Code map 81% in the top 4 and 92% in the top 12, Map in 0.12.1 64% in the top 4 and 75% in the top 12, Word-count search 63% in the top 4 and 81% in the top 12, Random 4% in the top 4 and 12% in the top 12. Word-count search ranks files by how many words of the title they contain. Nothing from the repositories was executed.</desc>
