<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc">
  <title id="title">Six changes completed, including repairs</title>
  <desc id="desc">Six changes per mode across two persistent three-change workflows. All final cumulative hidden checks and original/final suites pass. Failed attempts, repairs and provider recovery requests are included. Some provider responses have unreported usage; no exact overall savings claim.</desc>
