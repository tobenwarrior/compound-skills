<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="481" viewBox="0 0 1040 481" role="img" aria-labelledby="title desc">
  <title id="title">Same refactor. Different caller behavior.</title>
  <desc id="desc">Saved Shopkit slug refactor runs 64978b6b and 1e5d07d8 with Claude Sonnet on the same fixture and prompt. Without Compound, 13 tests passed but the facet key changed and the independent check failed. With Compound 0.16.0, 15 tests passed, the key was preserved, and the tests caught all three planted wrong refactors.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  <defs>
    <linearGradient id="theme-wash" x2="1" y2="1">
      <stop offset="0" stop-color="#fbefd6" />
      <stop offset=".6" stop-color="#fdf8ee" />
      <stop offset="1" stop-color="#e5f3e9" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1040" height="481" rx="28" fill="url(#theme-wash)" />
  <g fill="#14161c">
    <rect x="24" y="24" width="992" height="91" rx="28" fill="#fffdf8" stroke="#ece6d8" stroke-width="1" />
    <text x="52" y="58" font-size="13" font-weight="650" fill="#147a43">COMPOUND  /  Saved refactor example</text>
    <text x="52" y="98" font-size="28" font-weight="750" fill="#14161c">Same refactor. Different caller behavior.</text>
    <rect x="24" y="135" width="992" height="314.0" rx="28" fill="#fffdf8" stroke="#ece6d8" stroke-width="1" />
    <g transform="translate(48 155.000) scale(1.000000)">
      <rect x="14" y="10" width="448" height="214" rx="18" fill="#f7f6f2" />
      <text x="34" y="43" font-size="20" font-weight="700" fill="#14161c">Without Compound</text>
      <text x="34" y="83" font-size="19" font-weight="650" fill="#14161c" class="mono">Facet("Café", 1).key  →  "cafe"</text>
      <text x="34" y="120" font-size="17" font-weight="400" fill="#14161c">13 tests passed after the edit</text>
      <text x="34" y="151" font-size="16" font-weight="400" fill="#c2412d">Hidden check failed. The facet key changed.</text>
      <text x="34" y="193" font-size="19" font-weight="700" fill="#c2412d">0/3 planted regressions caught</text>
      <rect x="482" y="10" width="448" height="214" rx="18" fill="#e5f3e9" />
      <text x="502" y="43" font-size="20" font-weight="700" fill="#14161c">With Compound</text>
      <text x="502" y="83" font-size="19" font-weight="650" fill="#14161c" class="mono">Facet("Café", 1).key  →  "café"</text>
      <text x="502" y="120" font-size="17" font-weight="400" fill="#14161c">15 tests passed with caller checks</text>
      <text x="502" y="151" font-size="16" font-weight="400" fill="#147a43">Hidden check passed. The facet key stayed stable.</text>
      <text x="502" y="193" font-size="19" font-weight="700" fill="#147a43">3/3 planted regressions caught</text>
      <text x="14" y="260" font-size="16" font-weight="400" fill="#6b6f78">Same prompt and Shopkit revision · Two historical Claude Sonnet runs · Compound 0.16.0</text>
    </g>
  </g>
</svg>
