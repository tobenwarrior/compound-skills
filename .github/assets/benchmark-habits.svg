<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="832" viewBox="0 0 1280 832" role="img" aria-labelledby="title desc">
<title id="title">What changes with Compound</title>
<desc id="desc">Claude Code on the same tasks, with and without the plugin, run in pairs. Ran the bug before changing code: Opus 5.5 without Compound 0 of 24, with Compound 17 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 4 of 24. Showed a test failing on the unfixed code: Opus 5.5 without Compound 1 of 24, with Compound 23 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 5 of 24. Ran the tests on the final code: Opus 5.5 without Compound 32 of 32, with Compound 32 of 32. Sonnet 5.5 without Compound 32 of 32, with Compound 31 of 32. Planted regressions caught by the tests it left: Opus 5.5 without Compound 62 of 88, with Compound 63 of 88. Sonnet 5.5 without Compound 42 of 88, with Compound 42 of 88. Fixed the bug (hidden tests pass): Opus 5.5 without Compound 24 of 24, with Compound 24 of 24. Sonnet 5.5 without Compound 24 of 24, with Compound 24 of 24. Committed without an AI co-author line: Opus 5.5 without Compound 0 of 24, with Compound 24 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 24 of 24. Bug fixes: 3 tasks × 8 runs per arm and model. Regressions: 11 planted bugs the original tests miss, scored against the tests each run left behind (4 write tasks). Cost: 1.28× the tokens with Opus, 1.37× with Sonnet, over all six tasks.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
