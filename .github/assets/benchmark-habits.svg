<svg xmlns="http://www.w3.org/2000/svg" width="840" height="796" viewBox="0 0 840 796" role="img" aria-labelledby="title desc">
<title id="title">What changes with Compound</title>
<desc id="desc">Same tasks with and without Compound, 8 paired runs per task and model. Debugging habits (3 bug fixes, 24 runs per arm). Reproduced the bug before changing code: Opus 5.5 without Compound 0 of 24, with Compound 17 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 4 of 24. Sonnet: no clear difference. Showed a test failing on the unfixed code: Opus 5.5 without Compound 1 of 24, with Compound 23 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 5 of 24. Sonnet: no clear difference. Outcomes (no clear difference). Fixed the bug (hidden tests pass): Opus 5.5 without Compound 24 of 24, with Compound 24 of 24. Sonnet 5.5 without Compound 24 of 24, with Compound 24 of 24. Ran the tests on the final code: Opus 5.5 without Compound 32 of 32, with Compound 32 of 32. Sonnet 5.5 without Compound 32 of 32, with Compound 31 of 32. Planted regressions caught by the tests it left: Opus 5.5 without Compound 62 of 88, with Compound 63 of 88. Sonnet 5.5 without Compound 42 of 88, with Compound 42 of 88. Refactor trade-off (8 runs per arm). Kept how tax is rounded: Opus 5.5 without Compound 5 of 8, with Compound 8 of 8. Sonnet 5.5 without Compound 0 of 8, with Compound 0 of 8. Removed both rounding helpers, as asked: Opus 5.5 without Compound 5 of 8, with Compound 0 of 8. Sonnet 5.5 without Compound 8 of 8, with Compound 8 of 8. Commits (24 bug-fix runs per arm). Committed without an AI co-author line: Opus 5.5 without Compound 0 of 24, with Compound 24 of 24. Sonnet 5.5 without Compound 0 of 24, with Compound 24 of 24. Cost with Compound, six tasks weighted equally: Opus 5.5: 1.28× the tokens (1.22–1.34) and 1.38× the list-price cost (1.33–1.44). Sonnet 5.5: 1.37× the tokens (1.29–1.45) and 1.60× the list-price cost (1.50–1.70). Regressions: 3 planted per bug and 2 for the refactor, run against the tests each run left (88 checks per arm and model). Claude Code 2.1.314 · Compound 0.12.1 · 31 Oct 2026.</desc>
