<svg xmlns="http://www.w3.org/2000/svg" width="840" height="782" viewBox="0 0 840 782" role="img" aria-labelledby="title desc">
<title id="title">What changes with Compound</title>
<desc id="desc">Same tasks with and without Compound, 5 paired runs per task and model. Debugging habits (3 bug fixes, 15 runs per arm). Reproduced the bug before changing code: Opus 5.5 without Compound 0 of 15, with Compound 15 of 15. Sonnet 5.5 without Compound 0 of 15, with Compound 15 of 15. Showed a test failing on the unfixed code: Opus 5.5 without Compound 0 of 15, with Compound 15 of 15. Sonnet 5.5 without Compound 0 of 15, with Compound 15 of 15. Outcomes (20 coding runs per arm). Fixed the bug (hidden tests pass): Opus 5.5 without Compound 15 of 15, with Compound 15 of 15. Sonnet 5.5 without Compound 15 of 15, with Compound 15 of 15. Ran the tests on the final code: Opus 5.5 without Compound 20 of 20, with Compound 20 of 20. Sonnet 5.5 without Compound 16 of 20, with Compound 20 of 20. Planted regressions caught by the tests it left: Opus 5.5 without Compound 40 of 55, with Compound 49 of 55. Sonnet 5.5 without Compound 29 of 55, with Compound 42 of 55. Refactor (5 runs per arm). Kept how tax is rounded: Opus 5.5 without Compound 2 of 5, with Compound 5 of 5. Sonnet 5.5 without Compound 0 of 5, with Compound 5 of 5. Removed both rounding helpers, as asked: Opus 5.5 without Compound 5 of 5, with Compound 5 of 5. Sonnet 5.5 without Compound 5 of 5, with Compound 5 of 5. Commits (15 bug-fix runs per arm). Committed without an AI co-author line: Opus 5.5 without Compound 0 of 15, with Compound 15 of 15. Sonnet 5.5 without Compound 0 of 15, with Compound 14 of 15. Cost with Compound, six tasks weighted equally, with 95% intervals: Opus 5.5: 1.56× the tokens (1.47–1.65) and 1.56× the list-price cost (1.48–1.64). Sonnet 5.5: 1.55× the tokens (1.40–1.71) and 1.67× the list-price cost (1.53–1.84). Regressions: 3 planted per bug and 2 for the refactor, run against the tests each run left (55 checks per arm and model). Claude Code 2.1.316 · Compound 0.14.0 · 31 Oct 2026.</desc>
