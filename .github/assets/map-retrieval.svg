<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Find relevant source files</title>
  <desc id="desc">Without Compound 67%, with Compound 74% of changed source files found in the top four. Same 240 held-out commits. Without: word search skips common words and lists tests last. With: Compound map ranking. Top-four changed-source-file recall · 7 percentage points higher · not task speed or model cost. Compound 0.13.0 ranking · no history/co-change signal · modest gains on Click and Gin.</desc>
  <style>text{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
  <defs>
    <linearGradient id="theme-wash" x2="1" y2="1">
      <stop offset="0" stop-color="#fbefd6" />
      <stop offset=".6" stop-color="#fdf8ee" />
      <stop offset="1" stop-color="#e5f3e9" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1040" height="560" rx="28" fill="url(#theme-wash)" />
  <g fill="#14161c">
    <rect x="24" y="24" width="992" height="113" rx="28" fill="#fffdf8" stroke="#ece6d8" stroke-width="1" />
    <text x="52" y="58" font-size="13" font-weight="650" fill="#147a43">COMPOUND  /  WITHOUT / WITH</text>
    <text x="52" y="98" font-size="28" font-weight="750" fill="#14161c">Find relevant source files</text>
    <text x="52" y="128" font-size="14" font-weight="400" fill="#6b6f78">240 held-out commits · Flask, Click, Hono and Gin · same title and parent snapshot</text>
    <rect x="24" y="158" width="992" height="245" rx="28" fill="#fffdf8" stroke="#ece6d8" stroke-width="1" />
    <text x="52" y="202" font-size="19" font-weight="650" fill="#14161c">Changed source files in top 4 · higher is better</text>
    <text x="52" y="262" font-size="17" font-weight="600" fill="#14161c">Without Compound</text>
    <rect x="286" y="240" width="510" height="32" rx="16" fill="#f7f6f2" />
    <rect x="286" y="240" width="341.70000000000005" height="32" rx="16" fill="#9a9e95" />
    <text x="820" y="264" font-size="23" font-weight="700" fill="#14161c">67%</text>
    <text x="52" y="324" font-size="17" font-weight="600" fill="#14161c">With Compound</text>
    <rect x="286" y="302" width="510" height="32" rx="16" fill="#f7f6f2" />
    <rect x="286" y="302" width="377.4" height="32" rx="16" fill="#147a43" />
    <text x="820" y="326" font-size="23" font-weight="700" fill="#147a43">74%</text>
    <text x="52" y="442" font-size="14" font-weight="400" fill="#6b6f78">Without: word search skips common words and lists tests last. With: Compound map ranking.</text>
    <text x="52" y="473" font-size="14" font-weight="400" fill="#6b6f78">Top-four changed-source-file recall · 7 percentage points higher · not task speed or model cost.</text>
    <text x="52" y="504" font-size="14" font-weight="400" fill="#6b6f78">Compound 0.13.0 ranking · no history/co-change signal · modest gains on Click and Gin.</text>
  </g>
</svg>
