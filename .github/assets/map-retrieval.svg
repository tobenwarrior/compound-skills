<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc">
<title id="title">Does the map point at the right files?</title>
<desc id="desc">Flask (Python): 60 commits. Changed files found in the top 4 and top 12: code map 60% and 96%, map in 0.12.1 24% and 37%, text search 35% and 74%, random 5% and 15%. Click (Python): 60 commits. Changed files found in the top 4 and top 12: code map 81% and 95%, map in 0.12.1 49% and 71%, text search 73% and 92%, random 6% and 19%. Hono (TypeScript): 60 commits. Changed files found in the top 4 and top 12: code map 75% and 90%, map in 0.12.1 57% and 74%, text search 34% and 55%, random 1% and 3%. Gin (Go; repository not used for tuning): 60 commits. Changed files found in the top 4 and top 12: code map 81% and 92%, map in 0.12.1 64% and 75%, text search 63% and 81%, random 4% and 12%. Bars show the share of the changed source files found in the top 4 (solid; about what the agent sees) and top 12 (light). Text search ranks files by how many words of the title they contain. Nothing from the repositories was executed. The ranking was tuned on other, more recent commits of Flask, Click and Hono.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
