<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="806" viewBox="0 0 1280 806" role="img" aria-labelledby="title desc">
<title id="title">Does the map point at the right files?</title>
<desc id="desc">flask: 60 commits. Changed files found in the top 4 and top 12: code map 34% and 59%, text search 58% and 82%, random 5% and 15%. click: 60 commits. Changed files found in the top 4 and top 12: code map 54% and 74%, text search 64% and 83%, random 6% and 17%. hono: 60 commits. Changed files found in the top 4 and top 12: code map 48% and 65%, text search 43% and 61%, random 1% and 3%. Bars: share of the changed files found in the top 4 (solid; about what the agent sees) and top 12 (light). Text search ranks files by how many words of the title they contain. Nothing from the repositories was executed.</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
