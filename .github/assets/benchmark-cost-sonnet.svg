<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="792" viewBox="0 0 1280 792" role="img" aria-labelledby="title desc">
<title id="title">What Compound costs</title>
<desc id="desc">Bug: refund split: tokens 1.02 times (pairs ranged 1.00 to 1.17), time 1.02 times (0.93 to 1.13), 8 pairs. Bug: leap-year proration: tokens 1.32 times (pairs ranged 1.15 to 1.61), time 1.30 times (0.97 to 1.56), 8 pairs. Bug: December due date: tokens 1.06 times (pairs ranged 0.83 to 1.56), time 1.17 times (0.11 to 1.58), 8 pairs. Refactor: rounding helpers: tokens 1.06 times (pairs ranged 0.80 to 1.14), time 1.05 times (0.83 to 1.48), 8 pairs. Review a Flask commit: tokens 3.91 times (pairs ranged 1.60 to 4.87), time 1.81 times (1.30 to 2.35), 8 pairs. Question about Django: tokens 1.40 times (pairs ranged 1.05 to 1.91), time 1.34 times (1.06 to 2.08), 8 pairs. Dot: median of the 8 pairs. Line: lowest to highest pair. Over all six tasks Compound used 1.37× the tokens (95% interval 1.29–1.45). Always loaded: +369 tokens per request (18,543 → 18,912).</desc>
<defs>
<radialGradient id="glowGreen" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14161c" flood-opacity=".09"/></filter>
</defs>
