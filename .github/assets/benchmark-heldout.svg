<svg xmlns="http://www.w3.org/2000/svg" width="760" height="649" viewBox="0 0 760 649" role="img" aria-labelledby="title desc">
<title id="title">Held-out refactors: stock, a plain rule and Compound</title>
<desc id="desc">Held-out refactors: stock, a plain rule and Compound. Three refactors in shopkit, a library written after Compound&#x27;s refactor guide and frozen before any run. Each asks to merge two near-duplicate helpers whose obvious merge changes one caller. 5 runs per task, arm and model; Compound Skills 0.16.0 ran just after stock and the rule. Done correctly (hidden behavior test, duplicates gone, suites pass): Opus stock 10 of 15, Opus plain rule 10 of 15, Opus Compound 15 of 15, Sonnet stock 10 of 15, Sonnet plain rule 9 of 15, Sonnet Compound 15 of 15. Kept every caller&#x27;s behavior: Opus stock 10 of 15, Opus plain rule 14 of 15, Opus Compound 15 of 15, Sonnet stock 10 of 15, Sonnet plain rule 10 of 15, Sonnet Compound 15 of 15. Its tests catch the naive refactor: Opus stock 3 of 15, Opus plain rule 8 of 15, Opus Compound 15 of 15, Sonnet stock 0 of 15, Sonnet plain rule 0 of 15, Sonnet Compound 13 of 15. Planted wrong refactors its tests catch: Opus stock 6 of 45, Opus plain rule 17 of 45, Opus Compound 45 of 45, Sonnet stock 0 of 45, Sonnet plain rule 0 of 45, Sonnet Compound 45 of 45. Median cost of a refactor: Opus stock 15¢, Opus plain rule 21¢, Opus Compound 25¢, Sonnet stock 6.2¢, Sonnet plain rule 8.4¢, Sonnet Compound 11¢. Cost against stock, task by task: Opus stock 1×, Opus plain rule 1.20×, Opus Compound 1.64×, Sonnet stock 1×, Sonnet plain rule 1.31×, Sonnet Compound 1.64×. Each task has three planted wrong refactors; the tests a run leaves behind are run against them. The multiples compare each task&#x27;s runs with stock&#x27;s, with the tasks weighted equally.</desc>
