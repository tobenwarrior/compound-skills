<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1012" viewBox="0 0 1040 1012" role="img" aria-labelledby="title desc">
  <title id="title">Refactors: preserve every caller</title>
  <desc id="desc">Compound 0.16.0 · 3 held-out tasks · 15 runs per mode and model · Claude Code. Completed correctly · higher is better: Claude Opus 5.5 without 10, with 15/15; Claude Sonnet 5.5 without 10, with 15/15. Tests catch the naive merge · higher is better: Claude Opus 5.5 without 3, with 15/15; Claude Sonnet 5.5 without 0, with 13/15. Planted wrong refactors caught · higher is better: Claude Opus 5.5 without 6, with 45/45; Claude Sonnet 5.5 without 0, with 45/45. Median API cost · lower is better: Claude Opus 5.5 without 15, with 25¢; Claude Sonnet 5.5 without 6.2, with 11¢. Task-weighted API cost: 1.64× without Compound’s cost, with each model. All control failures came from one task. Earlier model/version; no universal savings claim.</desc>
