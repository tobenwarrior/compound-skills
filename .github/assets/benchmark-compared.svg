<svg xmlns="http://www.w3.org/2000/svg" width="760" height="825" viewBox="0 0 760 825" role="img" aria-labelledby="title desc">
<title id="title">Compared with other plugins</title>
<desc id="desc">Compared with other plugins. Every&#x27;s Compound Engineering 3.34.0 and pstack 0.15.36, installed as their READMEs say, on the three bugs and the refactor; Claude Opus 5.5 and Sonnet 5.5 together. With plain prompts, as everyone else ran; then started with the command each one tells you to type. Fixed the bug (hidden tests pass): stock 18 of 18, Every&#x27;s Compound Engineering with plain prompts 18 of 18, pstack with plain prompts 18 of 18, Every&#x27;s Compound Engineering with its commands 12 of 12, pstack with its command 12 of 12, Compound 18 of 18. Planted regressions the tests left behind catch: stock 45 of 66, Every&#x27;s Compound Engineering with plain prompts 38 of 66, pstack with plain prompts 42 of 66, Every&#x27;s Compound Engineering with its commands 30 of 44, pstack with its command 30 of 44, Compound 52 of 66. Refactor kept tax rounding and removed both helpers: stock 3 of 6, Every&#x27;s Compound Engineering with plain prompts 1 of 6, pstack with plain prompts 1 of 6, Every&#x27;s Compound Engineering with its commands 0 of 4, pstack with its command 2 of 4, Compound 6 of 6. Reproduced the bug before changing code: stock 0 of 18, Every&#x27;s Compound Engineering with plain prompts 0 of 18, pstack with plain prompts 0 of 18, Every&#x27;s Compound Engineering with its commands 12 of 12, pstack with its command 9 of 12, Compound 18 of 18. Showed a new test failing before the fix: stock 0 of 18, Every&#x27;s Compound Engineering with plain prompts 0 of 18, pstack with plain prompts 0 of 18, Every&#x27;s Compound Engineering with its commands 12 of 12, pstack with its command 9 of 12, Compound 18 of 18. Committed without an AI co-author line: stock 0 of 18, Every&#x27;s Compound Engineering with plain prompts 0 of 18, pstack with plain prompts 0 of 18, Every&#x27;s Compound Engineering with its commands 0 of 12, pstack with its command 0 of 12, Compound 18 of 18. Median cost of a bug fix, Opus 5.5: stock 10¢, Every&#x27;s Compound Engineering with plain prompts 11¢, pstack with plain prompts 12¢, Every&#x27;s Compound Engineering with its commands 183¢, pstack with its command 32¢, Compound 17¢. Median cost of a bug fix, Sonnet 5.5: stock 3.5¢, Every&#x27;s Compound Engineering with plain prompts 4.4¢, pstack with plain prompts 4.0¢, Every&#x27;s Compound Engineering with its commands 17¢, pstack with its command 9.5¢, Compound 5.6¢. Stock and Compound ran with plain prompts. Plain prompts: 3 runs per task and model. Commands (/ce-debug and /ce-work for Every&#x27;s CE, /poteto-mode for pstack): 2 runs, in a separate run with its own stock and Compound arms, where a bug fix&#x27;s median cost was 10¢ stock and 16¢ with Compound on Opus, 4.2¢ and 6.2¢ on Sonnet. The tasks were written for this benchmark and Compound was partly tuned on them.</desc>
