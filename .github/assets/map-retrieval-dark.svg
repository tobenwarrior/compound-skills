<svg xmlns="http://www.w3.org/2000/svg" width="840" height="675" viewBox="0 0 840 675" role="img" aria-labelledby="title desc">
<title id="title">Does the map point at the right files?</title>
<desc id="desc">Share of each commit&#x27;s changed source files that the map put in its top 4, querying with the commit&#x27;s title. 60 commits per repository, none used to tune the map. All 240 commits: Code map 74%, Map in 0.12.1 48%, Word-count search 51%, Random 4%. Word search that skips common words and lists tests last: 67%. Flask: Code map 60%, Map in 0.12.1 24%, Word-count search 35%, Random 5%. Python · 82 code files. Click: Code map 81%, Map in 0.12.1 49%, Word-count search 73%, Random 6%. Python · 63 code files; gap small enough to be noise. Hono: Code map 75%, Map in 0.12.1 57%, Word-count search 34%, Random 1%. TypeScript · 388 code files. Gin: Code map 81%, Map in 0.12.1 64%, Word-count search 63%, Random 4%. Go · 98 code files; not used for tuning. Word-count search ranks files by how many words of the title they contain; the outlined bar also skips common words and lists tests last. Nothing from the repositories was executed. The ranking was tuned on other, more recent commits of Flask, Click and Hono.</desc>
