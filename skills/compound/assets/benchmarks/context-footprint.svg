<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Package context footprint</title>
  <desc id="desc">Source word totals for three loading layers: 58 words in discovery descriptions, 791 across five skill entrypoints, and 3,911 across twelve workflow references. Actual loading depends on the host and task.</desc>
  <defs>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#15c99b"/>
      <stop offset="1" stop-color="#24c9e7"/>
    </linearGradient>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .section { font: 700 22px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .label { font: 600 18px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .small { font: 400 15px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .value { font: 700 26px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .value-teal { font: 700 26px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #21d7b0; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d8e0e5; }
    </style>
  </defs>

  <rect width="1280" height="700" fill="#0a0f14"/>
  <rect x="0" y="0" width="1280" height="5" fill="#ff8265"/>
  <text x="64" y="78" class="title">Package context footprint</text>
  <text x="64" y="114" class="subtitle">Three loading layers · words · measured with <tspan class="mono">scripts/check.py --json</tspan></text>
  <line x1="64" y1="145" x2="1216" y2="145" stroke="#29333b" stroke-width="2"/>

  <text x="64" y="193" class="section">Loading layers · words shown on a shared 0–4,000 scale</text>
  <text x="64" y="220" class="small">This is a package-footprint view, not a without/with benchmark; totals cover all files in each layer.</text>
  <rect x="64" y="246" width="1152" height="320" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <text x="96" y="282" class="small">LAYER</text>
  <text x="420" y="282" class="small">WORDS</text>
  <text x="980" y="282" class="small">WHEN IT LOADS</text>
  <line x1="96" y1="296" x2="1184" y2="296" stroke="#2a353d" stroke-width="1"/>
  <line x1="404" y1="305" x2="404" y2="526" stroke="#29343c" stroke-width="1"/>
  <line x1="936" y1="305" x2="936" y2="526" stroke="#29343c" stroke-width="1"/>

  <text x="96" y="353" class="label">Discovery descriptions</text>
  <text x="96" y="378" class="small">5 skills</text>
  <rect x="420" y="335" width="312" height="26" rx="13" fill="#202a31"/>
  <rect x="420" y="335" width="5" height="26" rx="3" fill="#68747d"/>
  <text x="748" y="355" class="value">58</text>
  <text x="980" y="355" class="small">Always visible</text>

  <text x="96" y="427" class="label">Skill entrypoints</text>
  <text x="96" y="452" class="small">compound + 4 shortcuts</text>
  <rect x="420" y="409" width="312" height="26" rx="13" fill="#202a31"/>
  <rect x="420" y="409" width="62" height="26" rx="13" fill="#24c9e7"/>
  <text x="748" y="429" class="value">791</text>
  <text x="980" y="429" class="small">On invocation</text>

  <text x="96" y="501" class="label">Workflow references</text>
  <text x="96" y="526" class="small">12 guides</text>
  <rect x="420" y="483" width="312" height="26" rx="13" fill="#202a31"/>
  <rect x="420" y="483" width="304" height="26" rx="13" fill="url(#teal)"/>
  <text x="748" y="503" class="value-teal">3,911</text>
  <text x="980" y="503" class="small">On demand</text>

  <rect x="64" y="604" width="1152" height="48" rx="12" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <circle cx="94" cy="628" r="7" fill="#21d7b0"/>
  <text x="114" y="634" class="small">Progressive loading keeps the always-visible discovery layer compact; the larger guides remain available when a task needs them.</text>
</svg>
