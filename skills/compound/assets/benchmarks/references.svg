<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
<title id="title">Tool-level lexical occurrences</title>
<desc id="description">Without Compound: 0.017 seconds. With Compound: 0.712 seconds. Correctness: 15/15 without and 15/15 with. Same fixture; rg full-scans lexical locations; Compound uses no-cache and also returns definition metadata. Tool-level only; no agent inference.</desc>
<defs>
<radialGradient id="greenGlow" cx="85%" cy="0%" r="75%"><stop offset="0" stop-color="#e6f3e8" stop-opacity=".95"/><stop offset="1" stop-color="#e6f3e8" stop-opacity="0"/></radialGradient>
<radialGradient id="goldGlow" cx="0%" cy="45%" r="65%"><stop offset="0" stop-color="#fbefd6" stop-opacity=".8"/><stop offset="1" stop-color="#fbefd6" stop-opacity="0"/></radialGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#147a43"/><stop offset="1" stop-color="#2f7a4a"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14161c" flood-opacity=".10"/></filter>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#14161c;font-feature-settings:"tnum","cv11"}.title{font-size:40px;font-weight:700;letter-spacing:-.045em}.subtitle{font-size:18px;fill:#6b6f78}.section{font-size:23px;font-weight:650;letter-spacing:-.02em}.label{font-size:19px;font-weight:600}.value{font-size:27px;font-weight:700;letter-spacing:-.03em}.accent{fill:#147a43}.note{font-size:16px;fill:#6b6f78}.badge{font-size:13px;font-weight:650;fill:#147a43}
</style></defs>
<rect width="1280" height="620" fill="#fdf8ee"/>
<rect width="1280" height="620" fill="url(#greenGlow)"/>
<rect width="1280" height="620" fill="url(#goldGlow)"/>
<rect x="44" y="40" width="1192" height="126" rx="28" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="78" y="88" class="title">Tool-level lexical occurrences</text>
<text x="78" y="126" class="subtitle">3 languages · 15 runs per mode · same 103-file fixture</text>
<rect x="1000" y="72" width="188" height="34" rx="17" fill="#e5f3e9" stroke="#ece6d8"/>
<circle cx="1020" cy="89" r="5" fill="#4ade80"/>
<text x="1034" y="95" class="badge">A/B benchmark</text>
<rect x="44" y="190" width="1192" height="220" rx="28" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="78" y="235" class="section">Wall time <tspan class="note">· lower is better</tspan></text>
<text x="78" y="286" class="label">Without Compound · rg</text>
<rect x="380" y="259" width="550" height="32" rx="16" fill="#f0ede6"/>
<rect x="380" y="259" width="11.93" height="32" rx="16" fill="#a7aaa1"/>
<text x="965" y="285" class="value">0.017 s</text>
<text x="78" y="350" class="label">With Compound · lookup</text>
<rect x="380" y="323" width="550" height="32" rx="16" fill="#f0ede6"/>
<rect x="380" y="323" width="500.00" height="32" rx="16" fill="url(#accent)"/>
<text x="965" y="349" class="value accent">0.712 s</text>
<rect x="44" y="430" width="1192" height="142" rx="28" fill="#fffdf8" stroke="#ece6d8" filter="url(#shadow)"/>
<text x="78" y="480" class="value accent">15/15 each</text>
<text x="78" y="506" class="note">correctness per mode</text>
<text x="398" y="480" class="value">15 / 15</text>
<text x="398" y="506" class="note">completed runs without / with</text>
<text x="78" y="536" class="note">Same fixture; rg full-scans lexical locations; Compound uses no-cache and also returns definition metadata.</text>
<text x="78" y="558" class="note">Tool-level only; no agent inference.</text>
</svg>
