<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Code-map and symbol-lookup microbenchmark</title>
  <desc id="desc">Synthetic benchmark on macOS arm64 with Python 3.14.5 and 103 generated files. Cold map build took 0.214 seconds, warm cache 0.090 seconds, and a one-file incremental map 0.157 seconds. Symbol lookup ranges are shown as reported rather than compressed into a single bar.</desc>
  <defs>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#15c99b"/>
      <stop offset="1" stop-color="#24c9e7"/>
    </linearGradient>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .section { font: 700 22px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .label { font: 600 18px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .small { font: 400 15px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .value { font: 700 20px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .value-teal { font: 700 20px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #21d7b0; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d8e0e5; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#0a0f14"/>
  <rect x="0" y="0" width="1280" height="5" fill="#ff8265"/>
  <text x="64" y="78" class="title">Code-map &amp; symbol-lookup microbenchmark</text>
  <text x="64" y="114" class="subtitle">macOS arm64 · Python 3.14.5 · 103 generated files · 331,745 B · Python, JS, TS, Go, and Rust</text>
  <line x1="64" y1="145" x2="1216" y2="145" stroke="#29333b" stroke-width="2"/>

  <text x="64" y="193" class="section">Map build and cache · lower is better</text>
  <text x="64" y="220" class="small">Times share a 0–0.25 second scale; file counts and bytes read stay visible beside each operation.</text>
  <rect x="64" y="246" width="1152" height="290" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <text x="96" y="282" class="small">OPERATION</text>
  <text x="420" y="282" class="small">TIME (SECONDS)</text>
  <text x="866" y="282" class="small">FILES PARSED</text>
  <text x="1028" y="282" class="small">SOURCE BYTES READ</text>
  <line x1="96" y1="296" x2="1184" y2="296" stroke="#2a353d" stroke-width="1"/>
  <line x1="404" y1="305" x2="404" y2="496" stroke="#29343c" stroke-width="1"/>
  <line x1="846" y1="305" x2="846" y2="496" stroke="#29343c" stroke-width="1"/>
  <line x1="1008" y1="305" x2="1008" y2="496" stroke="#29343c" stroke-width="1"/>

  <text x="96" y="342" class="label">Cold map build</text>
  <rect x="420" y="324" width="300" height="20" rx="10" fill="#202a31"/>
  <rect x="420" y="324" width="257" height="20" rx="10" fill="#68747d"/>
  <text x="740" y="342" class="value">0.214 s</text>
  <text x="866" y="342" class="value">103</text>
  <text x="1028" y="342" class="mono">331,745 B</text>

  <text x="96" y="406" class="label">Warm map cache <tspan class="small">(median)</tspan></text>
  <rect x="420" y="388" width="300" height="20" rx="10" fill="#202a31"/>
  <rect x="420" y="388" width="108" height="20" rx="10" fill="url(#teal)"/>
  <text x="740" y="406" class="value-teal">0.090 s</text>
  <text x="866" y="406" class="value">0</text>
  <text x="1028" y="406" class="mono">0 B</text>

  <text x="96" y="470" class="label">Incremental map <tspan class="small">(1 file edit)</tspan></text>
  <rect x="420" y="452" width="300" height="20" rx="10" fill="#202a31"/>
  <rect x="420" y="452" width="188" height="20" rx="10" fill="#24c9e7"/>
  <text x="740" y="470" class="value-teal">0.157 s</text>
  <text x="866" y="470" class="value">1</text>
  <text x="1028" y="470" class="mono">230 B</text>

  <text x="64" y="586" class="section">Symbol lookup · ranges preserved</text>
  <text x="64" y="613" class="small">Ranges span five language queries; cached values are medians of three runs per query.</text>
  <rect x="64" y="638" width="552" height="118" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <rect x="640" y="638" width="576" height="118" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <text x="96" y="676" class="label">Cold lookup · 5 languages</text>
  <text x="96" y="713" class="value">0.225–0.434 s</text>
  <text x="96" y="739" class="small">103 files · 5/5 definitions · 20/20 lexical occurrences</text>
  <text x="672" y="676" class="label">In-memory postings lookup</text>
  <text x="672" y="713" class="value-teal">0.102–0.268 s</text>
  <text x="672" y="739" class="small">0 files parsed · 102 cached files · ~1.9 KB JSON/query</text>
</svg>
