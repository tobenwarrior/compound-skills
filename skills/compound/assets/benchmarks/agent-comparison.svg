<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="title description">
  <title id="title">Codex navigation and bug-fix comparison</title>
  <desc id="description">On a single synthetic Python bug-fix task, three runs without Compound had median wall time 80.07 seconds and 257,336 input tokens. Two runs with Compound guidance and code map had median wall time 117.94 seconds and 492,126 input tokens. All five completed runs passed 14 tests. The map runs used different map queries and included map files in the fixture, so this is not an isolated measurement of the map alone.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#15c99b"/><stop offset="1" stop-color="#24c9e7"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f2f6f8; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #9daab2; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 600; }
      .value { font-size: 27px; font-weight: 700; }
      .accent { fill: #20d3b0; }
      .note { font-size: 17px; fill: #aebac1; }
    </style>
  </defs>
  <rect width="1280" height="770" fill="#0a0f14"/>
  <rect width="1280" height="5" fill="#ff8265"/>
  <text x="64" y="72" class="title">Code navigation + bug fix</text>
  <text x="64" y="110" class="subtitle">Codex CLI 0.162.1 · one synthetic Python task · median per completed run</text>
  <line x1="64" y1="140" x2="1216" y2="140" stroke="#29333b" stroke-width="2"/>
  <text x="64" y="191" class="section">Wall time</text>
  <text x="64" y="240" class="label">Without Compound</text>
  <rect x="340" y="215" width="545" height="34" rx="10" fill="#202a31"/>
  <rect x="340" y="215" width="291" height="34" rx="10" fill="#808b91"/>
  <text x="925" y="241" class="value">80.07 s</text>
  <text x="64" y="303" class="label">With Compound</text>
  <rect x="340" y="278" width="545" height="34" rx="10" fill="#202a31"/>
  <rect x="340" y="278" width="428" height="34" rx="10" fill="url(#accent)"/>
  <text x="925" y="304" class="value accent">117.94 s</text>
  <text x="64" y="376" class="section">Input tokens <tspan class="note">(including cached input)</tspan></text>
  <text x="64" y="425" class="label">Without Compound</text>
  <rect x="340" y="400" width="545" height="34" rx="10" fill="#202a31"/>
  <rect x="340" y="400" width="255" height="34" rx="10" fill="#808b91"/>
  <text x="925" y="426" class="value">257,336</text>
  <text x="64" y="488" class="label">With Compound</text>
  <rect x="340" y="463" width="545" height="34" rx="10" fill="#202a31"/>
  <rect x="340" y="463" width="488" height="34" rx="10" fill="url(#accent)"/>
  <text x="925" y="489" class="value accent">492,126</text>
  <line x1="64" y1="540" x2="1216" y2="540" stroke="#29333b" stroke-width="2"/>
  <text x="64" y="592" class="value accent">14 / 14</text>
  <text x="64" y="623" class="note">tests passed in every run</text>
  <text x="390" y="592" class="value">3 vs 2</text>
  <text x="390" y="623" class="note">completed runs</text>
  <text x="680" y="592" class="value">One task</text>
  <text x="680" y="623" class="note">synthetic repository</text>
  <text x="64" y="690" class="note">Compound runs included skill guidance and a code map; map-tool files were inside the fixture.</text>
  <text x="64" y="718" class="note">A small, uneven sample of one setup; results do not establish an isolated map effect.</text>
</svg>
