<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Native agent navigation and bug-fix benchmark</title>
  <desc id="desc">Reported wall-time comparison for Codex CLI and Claude Code with and without Compound. The repository does not include the original run records. Every reported run scored four out of four correct. Reported Codex CLI time is 40.06 seconds without Compound and 28.16 seconds with Compound; reported Claude Code time is 17.31 seconds without and 15.28 seconds with.</desc>
  <defs>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#15c99b"/>
      <stop offset="1" stop-color="#24c9e7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .section { font: 700 22px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .label { font: 600 17px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .small { font: 400 14px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca8b2; }
      .value { font: 700 19px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f7fa; }
      .value-teal { font: 700 19px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #21d7b0; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d8e0e5; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#0a0f14"/>
  <rect x="0" y="0" width="1280" height="5" fill="#ff8265"/>
  <text x="64" y="78" class="title">Native agent navigation &amp; bug-fix benchmark</text>
  <text x="64" y="114" class="subtitle">40-file Python repository · one bug-fix task · four grading checks</text>
  <rect x="780" y="92" width="436" height="34" rx="17" fill="#241d1b" stroke="#ff8265" stroke-width="1"/>
  <text x="998" y="114" text-anchor="middle" style="font:700 13px Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill:#ffad99; letter-spacing:.4px">REPORTED RESULTS · RUN RECORDS NOT IN REPOSITORY</text>
  <line x1="64" y1="145" x2="1216" y2="145" stroke="#29333b" stroke-width="2"/>

  <text x="64" y="193" class="section">Wall time · lower is better</text>
  <text x="64" y="220" class="small">Values are transcribed from the README table; the original run records are not included here.</text>

  <rect x="64" y="246" width="1152" height="394" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <text x="96" y="282" class="small">HOST / MODE</text>
  <text x="340" y="282" class="small">WALL TIME (SECONDS)</text>
  <text x="812" y="282" class="small">EXACT</text>
  <text x="932" y="282" class="small">INPUT / OUTPUT TOKENS</text>
  <line x1="96" y1="296" x2="1184" y2="296" stroke="#2a353d" stroke-width="1"/>
  <line x1="340" y1="305" x2="340" y2="602" stroke="#29343c" stroke-width="1"/>
  <line x1="800" y1="305" x2="800" y2="602" stroke="#29343c" stroke-width="1"/>
  <line x1="918" y1="305" x2="918" y2="602" stroke="#29343c" stroke-width="1"/>

  <text x="96" y="329" class="label">Codex CLI <tspan class="mono">0.162.1</tspan></text>
  <text x="116" y="367" class="small">Without Compound</text>
  <text x="116" y="413" class="small">With Compound</text>
  <rect x="340" y="351" width="450" height="22" rx="11" fill="#202a31"/>
  <rect x="340" y="351" width="401" height="22" rx="11" fill="#68747d"/>
  <rect x="340" y="397" width="450" height="22" rx="11" fill="#202a31"/>
  <rect x="340" y="397" width="282" height="22" rx="11" fill="url(#teal)" filter="url(#glow)"/>
  <text x="812" y="369" class="value">40.06 s</text>
  <text x="812" y="415" class="value-teal">28.16 s</text>
  <text x="932" y="369" class="mono">130,150 / 712</text>
  <text x="932" y="415" class="mono">96,601 / 690</text>

  <text x="96" y="466" class="label">Claude Code <tspan class="small">2.1.312 · sonnet</tspan></text>
  <text x="116" y="504" class="small">Without Compound</text>
  <text x="116" y="550" class="small">With Compound</text>
  <rect x="340" y="488" width="450" height="22" rx="11" fill="#202a31"/>
  <rect x="340" y="488" width="173" height="22" rx="11" fill="#68747d"/>
  <rect x="340" y="534" width="450" height="22" rx="11" fill="#202a31"/>
  <rect x="340" y="534" width="153" height="22" rx="11" fill="url(#teal)" filter="url(#glow)"/>
  <text x="812" y="506" class="value">17.31 s</text>
  <text x="812" y="552" class="value-teal">15.28 s</text>
  <text x="932" y="506" class="mono">123,501 / 1,259</text>
  <text x="932" y="552" class="mono">56,613 / 1,484</text>

  <line x1="96" y1="583" x2="1184" y2="583" stroke="#2a353d" stroke-width="1"/>
  <text x="96" y="612" class="small">Correct: <tspan class="value">4 / 4</tspan> in every run · Steps: <tspan class="value">8 → 7</tspan> Codex · <tspan class="value">8 → 8</tspan> Claude</text>

  <rect x="64" y="676" width="1152" height="86" rx="14" fill="#111820" stroke="#2a353d" stroke-width="2"/>
  <circle cx="100" cy="719" r="8" fill="#68747d"/>
  <text x="120" y="725" class="small">Without Compound</text>
  <circle cx="330" cy="719" r="8" fill="#21d7b0"/>
  <text x="350" y="725" class="small">With Compound</text>
  <text x="640" y="725" class="small">Bars share a 0–45 second scale · exact values are printed beside each bar</text>
</svg>
